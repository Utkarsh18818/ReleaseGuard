[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseguard"
version = "0.1.0"
description = "Evidence-backed release investigation on FalkorDB"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.1", "uvicorn==0.54.0", "falkordb==1.8.0", "httpx==0.28.1", "rq==2.11.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.0"]

[project.scripts]
releaseguard = "releaseguard.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
releaseguard = ["web/*.html", "web/*.css", "web/*.js", "web/icons/*", "web/fonts/*", "web/images/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
