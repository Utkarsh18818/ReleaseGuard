# Generic infrastructure; no ReleaseGuard application is implemented yet.
name: releaseguard-local
services:
  falkordb:
    image: falkordb/falkordb-server@sha256:8e4fe29e6646890a9deaf2f009ad2bc5e592d79fe9cd718810c3a97a8bcd34c0
    ports:
      - "127.0.0.1:6380:6379"
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --requirepass ${FALKORDB_PASSWORD:?Set FALKORDB_PASSWORD in .local/.env} --maxmemory 512mb --maxmemory-policy noeviction"
      REDISCLI_AUTH: "${FALKORDB_PASSWORD:?Set FALKORDB_PASSWORD in .local/.env}"
      FALKORDB_ARGS: "THREAD_COUNT 2"
    volumes:
      - ../.local/falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
